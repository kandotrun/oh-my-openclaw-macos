name: OhMyOpenClaw
options:
  bundleIdPrefix: run.kandot
  deploymentTarget:
    macOS: '27.0'
packages:
  OhMyOpenClaw:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  OhMyOpenClaw:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: OhMyOpenClaw
        product: OhMyOpenClawCore
    entitlements:
      path: Config/OhMyOpenClaw.entitlements
    settings:
      base:
        PRODUCT_NAME: Oh My OpenClaw
        PRODUCT_MODULE_NAME: OhMyOpenClaw
        PRODUCT_BUNDLE_IDENTIFIER: run.kandot.oh-my-openclaw.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oh My OpenClaw
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 同じネットワークの OpenClaw Gateway に接続します。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode derives the sandbox entitlements from these settings and drops them when they are off.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        CODE_SIGN_STYLE: Automatic
        # Sign to Run Locally by default; `just run <TEAM_ID>` signs with a development team.
        CODE_SIGN_IDENTITY: '-'
  OhMyOpenClawUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: OhMyOpenClaw
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: run.kandot.oh-my-openclaw.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: '-'
        TEST_TARGET_NAME: OhMyOpenClaw
schemes:
  OhMyOpenClaw:
    build:
      targets:
        OhMyOpenClaw: all
        OhMyOpenClawUITests: [test]
    test:
      targets:
        - OhMyOpenClawUITests
    run:
      config: Debug
