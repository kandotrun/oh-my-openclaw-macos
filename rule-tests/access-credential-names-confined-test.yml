id: access-credential-names-confined
valid:
  - 'let name = "CF-Access-Client-Id"'
  - 'let text = "Cloudflare Access のログイン"'
  - 'let team = "team.cloudflareaccess.com"'
  - 'let token = credentials.accessCredential'
invalid:
  - 'request.setValue(token, forHTTPHeaderField: "Cf-Access-Token")'
  - 'request.setValue(token, forHTTPHeaderField: "cf-access-token")'
  - 'let header = #"Cf-Access-Token"#'
  - |
    let header = """
    Cf-Access-Token
    """
  - 'let cookie = "CF_Authorization=" + org'
  - 'let relay = URL(string: "https://login.cloudflareaccess.org/")!'
  - 'let relay = URL(string: "https://login.fed.cloudflareaccess.org/transfer/\(key)")!'
