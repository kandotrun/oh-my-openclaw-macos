id: access-credential-use-confined
valid:
  - 'let token = credentials.access'
  - 'let task = accessSignInTask'
  - 'let session = makeSession()'
  - 'transform.apply(at: point)'
  - 'let move = transform.apply(at:)'
  - 'apply(changes)'
  - 'request.setValue("no-store", forHTTPHeaderField: "Cache-Control")'
  - 'let who = identity.email ?? identity.subject'
  # AppModel hands the credential on only in the functions that handle credentials.
  - |
    final class AppModel {
        func loadAttachment() { let access = credentials.accessCredential }
        private func credentialsToSave() { let previous = stored?.accessSession }
        private func startService() { accessIdentity = credentials.accessSession.flatMap { CloudflareAccessClaims(jwt: $0.appToken) } }
        private func saveDeviceToken() { guard old?.accessSession == nil else { return } }
    }
  - |
    @Observable @MainActor
    final class AppModel {
        func loadAttachment() { let load = { credentials.accessCredential } }
    }
invalid:
  - 'let session = credentials.accessSession'
  - 'credentials.accessSession = nil'
  - 'let credential = credentials.accessCredential'
  - 'credentials.accessCredential?.apply(to: &request)'
  - 'let saved = GatewayCredentials(token: "t", accessSession: session)'
  - 'session.apply(to: &request)'
  - 'access?.apply(to: &request)'
  - 'credential.map { $0.apply(to: &request) }'
  - 'apply(to: &request)'
  - 'let token = session.appToken'
  - 'request.setValue(session.appToken, forHTTPHeaderField: name)'
  - 'let claims = CloudflareAccessClaims(jwt: session.appToken)'
  - 'let tokens = sessions.map(\.appToken)'
  - 'let attach = session.apply(to:)'
  - 'let attach = access?.apply(to:)'
  - 'let attach = credential.map(CloudflareAccessSession.apply(to:))'
  - 'let attach = apply(to:)'
  # Anywhere else in AppModel, including its properties and extensions.
  - |
    final class AppModel {
        func send() { let session = credentials.accessSession }
    }
  - |
    final class AppModel {
        var token: String { credentials.accessSession?.appToken ?? "" }
    }
  - |
    final class AppModel {
        func loadAttachment() {}
        func handle() { credential.apply(to: &request) }
    }
  - |
    extension AppModel {
        func loadAttachment() { let access = credentials.accessCredential }
    }
  # The same function names outside AppModel.
  - |
    struct Loader {
        func loadAttachment() { let access = credentials.accessCredential }
    }
  - |
    final class Model {
        private func startService() { let session = credentials.accessSession }
    }
