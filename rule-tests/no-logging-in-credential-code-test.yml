id: no-logging-in-credential-code
valid:
  - 'let printed = format(value)'
  - 'session.apply(to: &request)'
  - 'printer.print(page)'
  - 'let version = ProcessInfo.processInfo.operatingSystemVersion'
  - import Foundation
  - import CryptoKit
  - import OhMyOpenClawCore
invalid:
  - 'print(session.appToken)'
  - 'Swift.print(token)'
  - 'debugPrint(credentials)'
  - 'dump(credentials)'
  - 'NSLog("%@", token)'
  - 'os_log("%{public}@", token)'
  - import os
  - import os.log
  - import OSLog
  - "@preconcurrency import OSLog"
  - import func os.os_log
  - 'let log = Logger(subsystem: "app", category: "access")'
  - 'let log = os.Logger(subsystem: "app", category: "access")'
  - 'let log = Logger.init(subsystem: "app", category: "access")'
