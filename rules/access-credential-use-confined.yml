id: access-credential-use-confined
language: Swift
severity: error
utils:
  credential-use:
    any:
      # The saved Access credential, and the session's raw application token.
      - kind: simple_identifier
        regex: '^(accessSession|accessCredential|appToken)$'
      # apply(to:), the method that adds an Access credential to a request, whether called or named
      # as a function, such as `credential.map(CloudflareAccessSession.apply(to:))`, and with or
      # without a receiver, as inside an extension of a credential type.
      - kind: call_expression
        all:
          - has:
              stopBy: neighbor
              any:
                - kind: simple_identifier
                  regex: '^apply$'
                - kind: navigation_expression
                  has:
                    stopBy: neighbor
                    field: suffix
                    has:
                      stopBy: neighbor
                      kind: simple_identifier
                      regex: '^apply$'
          - has:
              stopBy: neighbor
              kind: call_suffix
              has:
                stopBy: neighbor
                kind: value_arguments
                has:
                  stopBy: neighbor
                  kind: value_argument
                  # An argument label, or a label of a function reference.
                  has:
                    stopBy: neighbor
                    kind: value_argument_label
                    regex: '^to$'
  # AppModel's functions that handle credentials: attachment loading, the credentials a connect
  # saves, the session a connect uses, and the device token a hello issues.
  in-app-model-credential-handling:
    inside:
      stopBy: end
      kind: function_declaration
      has:
        field: name
        regex: '^(loadAttachment|credentialsToSave|startService|saveDeviceToken)$'
      inside:
        stopBy: end
        kind: class_declaration
        all:
          - has:
              field: declaration_kind
              regex: '^class$'
          - has:
              field: name
              regex: '^AppModel$'
rule:
  matches: credential-use
  not:
    matches: in-app-model-credential-handling
message: Only the Gateway request builders, AppModel's credential handling and the Access files may handle the Cloudflare Access credential.
note: |
  The app token must reach only the Gateway origin. GatewayClient and the inbound media and
  artifact loaders pass it on. In AppModel only loadAttachment, credentialsToSave, startService
  and saveDeviceToken may touch it; everything else goes through them.
files:
  - Sources/**
  - App/**
ignores:
  - Sources/OhMyOpenClawCore/CloudflareAccess*.swift
  - Sources/OhMyOpenClawCore/GatewayClient.swift
  - Sources/OhMyOpenClawCore/GatewayInboundMediaLoader.swift
  - Sources/OhMyOpenClawCore/GatewayArtifactLoader.swift
  - Sources/OhMyOpenClawCore/JSONValue.swift
