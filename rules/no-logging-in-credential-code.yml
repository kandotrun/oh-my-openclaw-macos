id: no-logging-in-credential-code
language: Swift
severity: error
rule:
  any:
    - kind: import_declaration
      has:
        kind: identifier
        regex: '^(os|OSLog)(\.|$)'
    - kind: call_expression
      has:
        stopBy: neighbor
        any:
          - kind: simple_identifier
            regex: '^(print|debugPrint|dump|NSLog|os_log|Logger)$'
          - kind: navigation_expression
            regex: '^((Swift|Foundation|os|OSLog)\.)?(print|debugPrint|dump|NSLog|os_log|Logger)(\.init)?$'
message: Credential code must not log; tokens and keys would end up in the system log.
note: |
  These files hold or send the Gateway's secrets and its Cloudflare Access credential, or, as
  GatewayProfiles.swift does, receive a person's Access session from the browser sign-in.
  Report failures as a GatewayFailure with a constant message instead.
files:
  - Sources/OhMyOpenClawCore/CloudflareAccess*.swift
  - Sources/OhMyOpenClawCore/NaClBox.swift
  - Sources/OhMyOpenClawCore/GatewayClient.swift
  - Sources/OhMyOpenClawCore/GatewayInboundMediaLoader.swift
  - Sources/OhMyOpenClawCore/GatewayArtifactLoader.swift
  - Sources/OhMyOpenClawCore/JSONValue.swift
  - App/CredentialStore.swift
  - App/AppModel.swift
  - App/GatewayProfiles.swift
