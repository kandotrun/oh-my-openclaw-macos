id: access-credential-names-confined
language: Swift
severity: error
rule:
  any:
    - kind: line_string_literal
    - kind: multi_line_string_literal
    - kind: raw_string_literal
  # Header names are case-insensitive on the wire, so any spelling counts.
  regex: '(?i)cf-access-token|cf_authorization|cloudflareaccess\.org'
message: Cloudflare Access credential names and relay hosts belong only in the Access files.
note: |
  Attach a person's sign-in with CloudflareAccessSession.apply(to:), which sends
  Cf-Access-Token only to the Gateway origin. Keep the Access header, cookie and relay
  names in Sources/OhMyOpenClawCore/CloudflareAccess*.swift.
files:
  - Sources/**
  - App/**
ignores:
  - Sources/OhMyOpenClawCore/CloudflareAccess*.swift
