name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    name: Shared layer
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: swift test
